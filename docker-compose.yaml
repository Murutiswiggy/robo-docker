name: roboshop

services:

  mongodb:
    build: ./mongodb
    image: murali9686/mongodb:2.0.0
    container_name: mongodb
    volumes:
    - mongodb:/data/db
  catalogue:
      build: ./catalogue
      image: murali9686/catalogue:2.0.0
      container_name: catalogue
      depends_on:
        - mongodb 
  
  frontend:
     build: ./frontend
     image: murali9686/frontend:2.0.0
     container_name: frontend
     ports: 
      - "80:80"
     depends_on:
      - catalogue
      - user
      - cart

  redis:
    image: redis:7
    container_name: redis
    volumes:
    - redis:/data

  user:
    build: ./user
    image: murali9686/user:2.0.0
    container_name: user
    environment:
       MONGO: true
       REDIS_URL: 'redis://redis:6379'
       MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
      - redis
      - mongodb
    
  cart:
   build: ./cart
   image: murali9686/cart:2.0.0
   container_name: cart
   environment:
     REDIS_HOST: redis
     CATALOGUE_HOST: catalogue
     CATALOGUE_PORT: 8080
   depends_on:
      - redis
      - catalogue

  mysql:
    build: ./mysql
    image: murali9686/mysql:2.0.0
    container_name: mysql
    command: --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
    volumes:
    - mysql:/var/lib/mysql

  shipping:
    build: ./shipping
    image: murali9686/shipping:2.0.0
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: mysql
    depends_on:
    - mysql
    - cart
  
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  
  payment:
    build: ./payment
    image: murali9686/payment:2.0.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq


networks:

  default:
    name: roboshop
    driver: bridge
    external: false

volumes:
  mongodb: # docker volume create mongodb
  redis: # docker volume create redis
  mysql: # docker volume create mysql
  rabbitmq: